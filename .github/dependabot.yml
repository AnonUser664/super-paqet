# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      # These are maintained as local forks; version-only bumps do not update
      # their source or preserve the documented transport patches.
      - dependency-name: "github.com/xtaci/kcp-go/v5"
      - dependency-name: "github.com/xtaci/smux"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
