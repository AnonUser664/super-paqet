listeners:
- address: 171.22.132.226:29999
  enc: 'null'
  network:
    interface: net0
    ipv4:
      addr: 171.22.132.226:29999
      router_mac: fe:54:00:d6:f7:93
    backend: packet
    tcp:
      local_flag:
      - PA
      remote_flag:
      - S
  adaptive: true
  packet_workers: 1
  kcp:
    mode: manual
    sndwnd: 4096
    rcvwnd: 4096
    ack_timestamps: false
    credit_hints: false
    adaptive_buffers: false
    smuxbuf: 4194304
    streambuf: 2097152
    mtu: 1350
    nodelay: 0
    interval: 30
    resend: 2
    nocongestion: 1
    wdelay: true
    acknodelay: false
    small_write_flush: 256
  shared_source: true
  sessions: 4
  max_sessions: 4
metrics: 127.0.0.1:29090
log:
  level: warn
  format: json
  interval: 10s
  flow_sample: 1000
profiling: false
reload:
  enabled: true
  interval: 250ms
  debounce: 500ms
forwards: []
limits:
  connections: 200000
  sessions: 1024
  open_timeout: 15s
  dial_timeout: 5s
  udp_idle: 60s
  memory_mib: 1536
